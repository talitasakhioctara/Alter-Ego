    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .design-container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        .design-title {
            font-family: 'Cinzel Decorative', serif;

            font-family: 'Poppins', sans-serif;
            color: #ff8c00;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .canva-frame-wrapper {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 56.2500%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 2px solid #00f2fe;
            border-radius: 12px;
            overflow: hidden;
            background-color: #0b0617;
            will-change: transform;
        }
        .canva-credit {
            display: inline-block;
            margin-top: 15px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            color: #00f2fe;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;

        .canva-credit:hover {
            color: #e65c00;

    <video autoplay loop muted playsinline class="video-bg">
