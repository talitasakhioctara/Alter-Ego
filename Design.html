<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alter Ego - Design Presentasi</title>

    <!-- Google Fonts Seragam -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@700&family=Metamorphous&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- Menghubungkan ke CSS Utama -->
    <link rel="stylesheet" href="styles.css">

    <!-- CSS Khusus Mengatur Layout Presentasi Canva -->
    <style>
        .design-container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        .design-title {
            font-family: 'Cinzel Decorative', serif;
            color: #5c4033;
            font-size: 26px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .design-subtitle {
            font-family: 'Poppins', sans-serif;
            color: #7a5a40;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Pembungkus Iframe Canva Hasil Sinkronisasi */
        .canva-frame-wrapper {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 56.2500%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
            background-color: #ffffff;
            will-change: transform;
        }

        /* Styling teks kredit di bawah presentasi agar estetik */
        .canva-credit {
            display: inline-block;
            margin-top: 15px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            color: #7a5a40;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }

        .canva-credit:hover {
            color: #e65c00;
        }
    </style>
</head>
<body>

    <!-- KOP SURAT ATAS (Sama dengan Halaman Product) -->
    <div class="kop-surat">
        <div class="instansi">SMAN 71 JAKARTA</div>
        <div class="nama-kelompok">ALTER EGO</div>
        <div class="sub-kop">Proyek Informatika • Temukan Karakter Alter Egomu</div>
    </div>

    <!-- NAVBAR (Menu Design Aktif) -->
    <nav class="navbar">
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-links" id="nav-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="Design.html" class="active">Design</a></li>
            <li><a href="product.html">Product</a></li>
        </ul>
    </nav>

    <!-- KONTEN PRESENTASI CANVA -->
    <div class="design-container">
        <h2 class="design-title">DOKUMENTASI DESAIN PROYEK</h2>
        <p class="design-subtitle">Garis besar konsep, riset karakter, dan perancangan sistem Alter Ego kelompok kami.</p>
        
        <!-- Area Frame Canva Terintegrasi -->
        <div class="canva-frame-wrapper">
            <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0; margin: 0;"
                src="https://www.canva.com/design/DAHGc2qto0o/pjXDmKoFRYaL1Nz9QxHxEA/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen">
            </iframe>
        </div>

        <!-- Link Kredit Terformat Rapi -->
        <a class="canva-credit" href="https://www.canva.com/design/DAHGc2qto0o/pjXDmKoFRYaL1Nz9QxHxEA/view?utm_content=DAHGc2qto0o&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link" target="_blank" rel="noopener">
            ✨ Alter Ego TIK — Oleh Talita Sakhi Octara
        </a>
    </div>

    <!-- JAVASCRIPT NAVBAR MOBILE -->
    <script>
        const mobileMenu = document.getElementById('mobile-menu');
        const navList = document.getElementById('nav-list');

        mobileMenu.addEventListener('click', () => {
            navList.classList.toggle('active');
            mobileMenu.classList.toggle('is-active');
        });
    </script>
</body>
</html>
