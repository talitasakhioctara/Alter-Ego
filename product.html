<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alter Ego - Product Quiz</title>

    <!-- Google Fonts Seragam -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@700&family=Metamorphous&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- Menghubungkan ke CSS Utama -->
    <link rel="stylesheet" href="styles.css">

    <!-- CSS Khusus Komponen Fungsional Kuis -->
    <style>
        .quiz-box {
            background-color: #ffffff;
            border: none;
            border-radius: 15px;
            padding: 35px;
            max-width: 600px;
            margin: 40px auto;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Slide Animasi Karakter Pembuka */
        .slide-frame {
            width: 220px;
            height: 330px;
            margin: 0 auto 15px auto;
            overflow: hidden;
            border: none;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-img {
            max-width: 100%;
            max-height: 100%;
            display: none;
            object-fit: contain;
        }

        .slide-img.active {
            display: block;
        }

        .welcome-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 26px;
            color: #5c4033;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* Form Registrasi */
        .form-container {
            padding: 10px;
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            color: #5c4033;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #5c4033;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fcf9f2;
        }

        /* Tombol Aksi */
        .btn-action {
            display: inline-block;
            width: 100%;
            background: linear-gradient(135deg, #ff9900, #e65c00);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            margin-top: 10px;
            text-align: center;
        }

        .btn-action:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(230, 92, 0, 0.3);
        }

        /* Tampilan Soal Kuis */
        .progress-bar {
            font-size: 14px;
            color: #7a5a40;
            font-weight: bold;
            text-align: right;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #5c4033;
            margin-bottom: 25px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #fcf9f2;
            border: 2px solid #5c4033;
            color: #5c4033;
            padding: 12px 20px;
            font-size: 15px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Poppins', sans-serif;
        }

        .option-btn:hover {
            background-color: #5c4033;
            color: #ffffff;
        }

        /* Hasil Akhir Nyentrik */
        .result-title {
            font-family: 'Cinzel Decorative', serif; /* Font nyentrik & eksklusif */
            font-size: 34px;
            font-weight: bold;
            color: #e65c00;
            margin: 15px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .result-img {
            max-width: 220px;
            height: auto;
            margin: 20px auto;
            display: block;
            border: none;
        }

        .result-cta {
            font-size: 15px;
            color: #5c4033;
            font-weight: 600;
            line-height: 1.6;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <!-- KOP SURAT ATAS -->
    <div class="kop-surat">
        <div class="instansi">SMAN 71 JAKARTA</div>
        <div class="nama-kelompok">ALTER EGO</div>
        <div class="sub-kop">Proyek Informatika • Temukan Karakter Alter Egomu</div>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-links" id="nav-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="Design.html">Design</a></li>
            <li><a href="product.html" class="active">Product</a></li>
        </ul>
    </nav>

    <!-- CONTAINER UTAMA KUIS -->
    <div class="quiz-box">
        
        <!-- TAHAP 1: SCREEN PEMBUKA / SLIDESHOW -->
        <div id="tahap-welcome">
            <div class="slide-frame">
                <img src="21154.png" class="slide-img active" alt="Karakter 1">
                <img src="21153.png" class="slide-img" alt="Karakter 2">
                <img src="21155.png" class="slide-img" alt="Karakter 3">
                <img src="21156.png" class="slide-img" alt="Karakter 4">
            </div>
            <div class="welcome-title">FIND YOUR ALTER EGO</div>
            <button class="btn-action" onclick="pindahKeForm()">Mulai Petualangan</button>
        </div>

        <!-- TAHAP 2: FORM REGISTRASI DATA DIRI -->
        <div id="tahap-form" class="hidden">
            <div class="form-container">
                <div class="form-group">
                    <label for="nama-input">Nama Lengkap / Panggilan :</label>
                    <input type="text" id="nama-input" placeholder="Masukkan namamu...">
                </div>
                <div class="form-group">
                    <label for="email-input">Alamat Email Aktif :</label>
                    <input type="email" id="email-input" placeholder="Masukkan emailmu...">
                </div>
                <button class="btn-action" onclick="pindahKeKuis()">Masuk Ke Dunia Alter Ego</button>
            </div>
        </div>

        <!-- TAHAP 3: FORM PERTANYAAN KUIS JAVASCRIPT -->
        <div id="tahap-kuis" class="hidden">
            <div class="progress-bar" id="kuis-progress">Soal 1 dari 12</div>
            <div class="question-text" id="kuis-soal">Memuat pertanyaan...</div>
            <div class="options-container" id="kuis-pilihan">
                <!-- Pilihan jawaban -->
            </div>
        </div>

        <!-- TAHAP 4: HALAMAN HASIL AKHIR (BESAR & NYENTRIK) -->
        <div id="tahap-hasil" class="hidden">
            <p style="font-size: 14px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; color: #7a5a40;">Alter Egomu Adalah</p>
            <div class="result-title" id="hasil-karakter">THE GUARDIAN</div>
            <img src="" id="hasil-gambar" class="result-img" alt="Karakter Pemenang">
            
            <!-- Kalimat ajakan dinamis -->
            <p class="result-cta" id="hasil-teks-ajakan">Memuat petualanganmu...</p>
            
            <!-- Tombol Link Scratch Dinamis Berbeda Tiap Karakter -->
            <a href="#" id="hasil-link-scratch" target="_blank" class="btn-action">Mainkan Game Karaktermu di Scratch</a>
        </div>

    </div>

    <!-- ENGINE LOGIKA JAVASCRIPT KUIS -->
    <script>
        // 1. ENGINE SLIDESHOW KARAKTER
        let indeksSlide = 0;
        const daftarGambar = document.querySelectorAll('.slide-img');
        
        function jalankanSlideshow() {
            daftarGambar[indeksSlide].classList.remove('active');
            indeksSlide = (indeksSlide + 1) % daftarGambar.length;
            daftarGambar[indeksSlide].classList.add('active');
        }
        let intervalSlideshow = setInterval(jalankanSlideshow, 2000);

        // 2. NAVIGASI ANTAR TAHAP
        function pindahKeForm() {
            clearInterval(intervalSlideshow);
            document.getElementById('tahap-welcome').classList.add('hidden');
            document.getElementById('tahap-form').classList.remove('hidden');
        }

        let namaPemain = "";
        let emailPemain = "";

        function pindahKeKuis() {
            namaPemain = document.getElementById('nama-input').value.trim();
            emailPemain = document.getElementById('email-input').value.trim();

            if (namaPemain === "" || emailPemain === "") {
                alert("Harap isi Nama dan Email kamu terlebih dahulu ya!");
                return;
            }

            document.getElementById('tahap-form').classList.add('hidden');
            document.getElementById('tahap-kuis').classList.remove('hidden');
            tampilkanSoal();
        }

        // 3. BANK DATA 12 PERTANYAAN LOGIKA KUIS
        const dataKuis = [
            {
                q: "1. Temanmu hampir membuat keputusan berisiko besar. Kamu...",
                o: [
                    { t: "A. Mengambil alih demi melindungi dia", k: "guardian" },
                    { t: "B. Mendorong dia mengambil langkah besar", k: "driven" },
                    { t: "C. Menjelaskan realita apa adanya", k: "truthteller" },
                    { t: "D. Menenangkan dia agar tidak panik", k: "peacemaker" }
                ]
            },
            {
                q: "2. Dalam konflik kelompok, kamu...",
                o: [
                    { t: "A. Menjaga semua orang tetap aman", k: "guardian" },
                    { t: "B. Mencari solusi ideal jangka panjang", k: "visionary" },
                    { t: "C. Menyampaikan fakta siapa yang benar", k: "truthteller" },
                    { t: "D. Meredakan suasana agar damai", k: "peacemaker" }
                ]
            },
            {
                q: "3. Seseorang sedang gagal dan frustrasi. Kamu...",
                o: [
                    { t: "A. Melindungi dia dari tekanan tambahan", k: "guardian" },
                    { t: "B. Mendorong dia bangkit lebih kuat", k: "driven" },
                    { t: "C. Memberi perspektif jujur tentang kesalahannya", k: "truthteller" },
                    { t: "D. Membuat dia merasa lebih tenang", k: "peacemaker" }
                ]
            },
            {
                q: "4. Kalau seseorang mengabaikan nasihatmu, kamu...",
                o: [
                    { t: "A. Tetap mengawasi demi keamanannya", k: "guardian" },
                    { t: "B. Membiarkan dia belajar dari realita", k: "grounded" },
                    { t: "C. Mengingatkan dengan tegas dan jujur", k: "truthteller" },
                    { t: "D. Mengurangi konflik dan tidak memaksa", k: "peacemaker" }
                ]
            },
            {
                q: "5. Saat kerja kelompok, kamu biasanya...",
                o: [
                    { t: "A. Mengatur agar semuanya aman dan stabil", k: "guardian" },
                    { t: "B. Mendorong hasil terbaik", k: "driven" },
                    { t: "C. Memberi arah besar yang jelas", k: "visionary" },
                    { t: "D. Menjaga suasana tetap harmonis", k: "peacemaker" }
                ]
            },
            {
                q: "6. Temanmu terlalu bergantung padamu. Kamu...",
                o: [
                    { t: "A. Mengontrol agar dia tidak jatuh", k: "guardian" },
                    { t: "B. Mendorong dia lebih kuat dan mandiri", k: "driven" },
                    { t: "C. Menghadapkan dia pada realita", k: "truthteller" },
                    { t: "D. Menenangkan agar dia tidak cemas berlebihan", k: "peacemaker" }
                ]
            },
            {
                q: "7. Saat melihat ketidakadilan, kamu...",
                o: [
                    { t: "A. Melindungi pihak yang lemah", k: "guardian" },
                    { t: "B. Mengubah situasi dengan tindakan besar", k: "driven" },
                    { t: "C. Mengatakan fakta tanpa bias", k: "truthteller" },
                    { t: "D. Menjaga situasi tetap damai dulu", k: "peacemaker" }
                ]
            },
            {
                q: "8. Ketika rencana berubah mendadak, kamu...",
                o: [
                    { t: "A. Langsung mengamankan situasi", k: "guardian" },
                    { t: "B. Melihat peluang baru", k: "visionary" },
                    { t: "C. Menganalisis realita yang terjadi", k: "truthteller" },
                    { t: "D. Menenangkan semua orang", k: "peacemaker" }
                ]
            },
            {
                q: "9. Temanmu sedang sedih berat. Kamu...",
                o: [
                    { t: "A. Menjaganya sampai stabil", k: "guardian" },
                    { t: "B. Mendorong dia bangkit", k: "driven" },
                    { t: "C. Memberi kebenaran yang perlu dia dengar", k: "truthteller" },
                    { t: "D. Menenangkan emosinya", k: "peacemaker" }
                ]
            },
            {
                q: "10. Dalam keputusan penting, kamu...",
                o: [
                    { t: "A. Memilih yang paling aman", k: "guardian" },
                    { t: "B. Memilih yang paling ambisius", k: "driven" },
                    { t: "C. Memilih berdasarkan fakta paling realistis", k: "truthteller" },
                    { t: "D. Memilih yang paling damai dan minim konflik", k: "peacemaker" }
                ]
            },
            {
                q: "11. Ketika kamu melihat seseorang membuat kesalahan fatal, reaksi pertamamu...",
                o: [
                    { t: "A. Membantu memperbaiki tanpa menghakimi", k: "guardian" },
                    { t: "B. Menjadikannya pelajaran untuk maju terus", k: "driven" },
                    { t: "C. Menyatakan kesalahan itu secara langsung agar sadar", k: "truthteller" },
                    { t: "D. Menghibur hatinya agar tidak larut dalam kesedihan", k: "peacemaker" }
                ]
            },
            {
                q: "12. Apa visi terbesarmu saat memimpin sebuah tim?",
                o: [
                    { t: "A. Memastikan semua anggota tim terlindungi dan sejahtera", k: "guardian" },
                    { t: "B. Mencapai target tertinggi bagaimanapun caranya", k: "driven" },
                    { t: "C. Menegakkan transparansi dan kejujuran mutlak", k: "truthteller" },
                    { t: "D. Menciptakan keharmonisan dan kedamaian antar anggota", k: "peacemaker" }
                ]
            }
        ];

        let indeksSoalSkrg = 0;
        let skorKepribadian = {};

        function tampilkanSoal() {
            if (indeksSoalSkrg >= dataKuis.length) {
                hitungDanTampilkanHasil();
                return;
            }

            document.getElementById('kuis-progress').innerText = `Soal ${indeksSoalSkrg + 1} dari ${dataKuis.length}`;
            let soalSkrg = dataKuis[indeksSoalSkrg];
            document.getElementById('kuis-soal').innerText = soalSkrg.q;

            let kontainerPilihan = document.getElementById('kuis-pilihan');
            kontainerPilihan.innerHTML = "";

            soalSkrg.o.forEach(opsi => {
                let tombol = document.createElement('button');
                tombol.className = "option-btn";
                tombol.innerText = opsi.t;
                tombol.onclick = () => pilihJawaban(opsi.k);
                kontainerPilihan.appendChild(tombol);
            });
        }

        function pilihJawaban(karakter) {
            skorKepribadian[karakter] = (skorKepribadian[karakter] || 0) + 1;
            indeksSoalSkrg++;
            tampilkanSoal();
        }

        // 4. LOGIKA HASIL AKHIR CUSTOM LINK SCRATCH TIAP KARAKTER
        function hitungDanTampilkanHasil() {
            document.getElementById('tahap-kuis').classList.add('hidden');
            document.getElementById('tahap-hasil').classList.remove('hidden');

            let karakterPemenang = "guardian"; 
            let skorTertinggi = -1;

            for (let kunci in skorKepribadian) {
                if (skorKepribadian[kunci] > skorTertinggi) {
                    skorTertinggi = skorKepribadian[kunci];
                    karakterPemenang = kunci;
                }
            }

            // Database Pemetaan Karakter, Gambar, dan Link Scratch yang Berbeda-beda
            let dataVisual = {
                "guardian": { 
                    nama: "THE GUARDIAN", 
                    img: "21154.png", 
                    link: "https://scratch.mit.edu/projects/LINK_GUARDIAN_KAMU" 
                },
                "driven": { 
                    nama: "THE DRIVEN ONE", 
                    img: "21153.png", 
                    link: "https://scratch.mit.edu/projects/LINK_DRIVEN_KAMU" 
                },
                "truthteller": { 
                    nama: "THE TRUTH TELLER", 
                    img: "21155.png", 
                    link: "https://scratch.mit.edu/projects/LINK_TRUTHTELLER_KAMU" 
                },
                "peacemaker": { 
                    nama: "THE PEACEMAKER", 
                    img: "21156.png", 
                    link: "https://scratch.mit.edu/projects/LINK_PEACEMAKER_KAMU" 
                },
                "visionary": { 
                    nama: "THE VISIONARY", 
                    img: "21153.png", 
                    link: "https://scratch.mit.edu/projects/LINK_VISIONARY_KAMU" 
                },
                "grounded": { 
                    nama: "THE GROUNDED", 
                    img: "21154.png", 
                    link: "https://scratch.mit.edu/projects/LINK_GROUNDED_KAMU" 
                }
            };

            let hasilAkhir = dataVisual[karakterPemenang] || dataVisual["guardian"];

            // Terapkan data dinamis ke elemen halaman kuis
            document.getElementById('hasil-karakter').innerText = hasilAkhir.nama;
            document.getElementById('hasil-gambar').src = hasilAkhir.img;
            document.getElementById('hasil-teks-ajakan').innerText = `Hai ${namaPemain}, takdir telah memilihmu sebagai ${hasilAkhir.nama}! Ayo uji ketangkasan alter egomu langsung di dalam game khusus yang telah kami rancang di platform Scratch melalui tombol di bawah ini!`;
            
            // Mengubah link tombol Scratch secara spesifik sesuai karakter yang didapat
            document.getElementById('hasil-link-scratch').href = hasilAkhir.link;
        }

        // 5. ENGINE NAVBAR MOBILE
        const mobileMenu = document.getElementById('mobile-menu');
        const navList = document.getElementById('nav-list');

        mobileMenu.addEventListener('click', () => {
            navList.classList.toggle('active');
            mobileMenu.classList.toggle('is-active');
        });
    </script>
</body>
</html>
