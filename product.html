<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alter Ego - Product Quiz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@700&family=Metamorphous&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <style>
        /* Menyembunyikan tahap kuis yang belum aktif agar tidak bocor ke bawah */
        .hidden {
            display: none !important;
        }

        .quiz-box {
            background-color: #ffffff;
            border: none;
            border-radius: 15px;
            padding: 35px;
            max-width: 600px;
            margin: 40px auto;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Slide Animasi Karakter Pembuka */
        .slide-frame {
            width: 220px;
            height: 330px;
            margin: 0 auto 15px auto;
            overflow: hidden;
            border: none;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-img {
            max-width: 100%;
            max-height: 100%;
            display: none;
            object-fit: contain;
        }

        .slide-img.active {
            display: block;
        }

        .welcome-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 28px;
            color: #5c4033;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* Form Registrasi */
        .form-container {
            padding: 10px;
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            color: #5c4033;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #5c4033;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fcf9f2;
        }

        /* Tombol Aksi */
        .btn-action {
            display: inline-block;
            width: 100%;
            background: linear-gradient(135deg, #ff9900, #e65c00);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            margin-top: 15px;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-action:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(230, 92, 0, 0.3);
        }

        /* Tampilan Soal Kuis */
        .progress-bar {
            font-size: 14px;
            color: #7a5a40;
            font-weight: bold;
            text-align: right;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #5c4033;
            margin-bottom: 25px;
            text-align: left;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #fcf9f2;
            border: 2px solid #5c4033;
            color: #5c4033;
            padding: 14px 20px;
            font-size: 15px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Poppins', sans-serif;
        }

        .option-btn:hover {
            background-color: #5c4033;
            color: #ffffff;
        }

        /* Desain Halaman Hasil Minimalis Nyentrik */
        .result-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 34px;
            font-weight: bold;
            color: #e65c00;
            margin: 5px 0;
        }

        .result-tokoh {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            color: #7a5a40;
            margin-bottom: 15px;
            font-style: italic;
            font-weight: bold;
        }

        .result-img {
            max-width: 220px;
            height: auto;
            margin: 20px auto;
            display: block;
        }

        .result-cta {
            font-size: 16px;
            color: #5c4033;
            font-weight: 600;
            margin: 25px 0 15px 0;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="kop-surat">
        <div class="instansi">SMAN 71 JAKARTA</div>
        <div class="nama-kelompok">ALTER EGO</div>
        <div class="sub-kop">Proyek Informatika • Temukan Karakter Alter Egomu</div>
    </div>

    <nav class="navbar">
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-links" id="nav-list">
            <li><a href="/">Home</a></li>
            <li><a href="/design">Design</a></li>
            <li><a href="/product" class="active">Product</a></li>
        </ul>
    </nav>

    <div class="quiz-box">
        
        <div id="tahap-welcome">
            <div class="slide-frame">
                <img src="{{ url_for('static', filename='21154.png') }}" class="slide-img active" alt="Julius Caesar">
                <img src="{{ url_for('static', filename='21153.png') }}" class="slide-img" alt="Barack Obama">
                <img src="{{ url_for('static', filename='21152.png') }}" class="slide-img" alt="Alexander Agung">
                <img src="{{ url_for('static', filename='21150.png') }}" class="slide-img" alt="Socrates">
            </div>
            <div class="welcome-title">FIND YOUR ALTER EGO</div>
            <button class="btn-action" onclick="pindahKeForm()">Mulai Petualangan</button>
        </div>

        <div id="tahap-form" class="hidden">
            <div class="form-container">
                <div class="form-group">
                    <label for="nama-input">Nama Lengkap / Panggilan :</label>
                    <input type="text" id="nama-input" placeholder="Masukkan namamu...">
                </div>
                <div class="form-group">
                    <label for="email-input">Alamat Email Aktif :</label>
                    <input type="email" id="email-input" placeholder="Masukkan emailmu...">
                </div>
                <button class="btn-action" onclick="pindahKeKuis()">Masuk Ke Dunia Alter Ego</button>
            </div>
        </div>

        <div id="tahap-kuis" class="hidden">
            <div class="progress-bar" id="kuis-progress">Soal 1 dari 12</div>
            <div class="question-text" id="kuis-soal">Memuat pertanyaan...</div>
            <div class="options-container" id="kuis-pilihan"></div>
        </div>

        <div id="tahap-hasil" class="hidden">
            <p style="font-size: 13px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; color: #7a5a40; margin-bottom: 0;">Alter Egomu Adalah</p>
            
            <div class="result-title" id="hasil-karakter">THE GUARDIAN</div>
            <div class="result-tokoh" id="hasil-tokoh">(Julius Caesar)</div>
            
            <img src="" id="hasil-gambar" class="result-img" alt="Karakter Pemenang">
            
            <p class="result-cta" id="hasil-teks-ajakan">Yuk, buka dunia barumu!</p>
            
            <a href="#" id="hasil-link-scratch" target="_blank" class="btn-action">Buka Link Game Scratch Karaktermu</a>
        </div>

    </div>

    <script>
        // 1. ENGINE SLIDESHOW KARAKTER
        let indeksSlide = 0;
        const daftarGambar = document.querySelectorAll('.slide-img');
        
        function jalankanSlideshow() {
            if(daftarGambar.length === 0) return;
            daftarGambar[indeksSlide].classList.remove('active');
            indeksSlide = (indeksSlide + 1) % daftarGambar.length;
            daftarGambar[indeksSlide].classList.add('active');
        }
        let intervalSlideshow = setInterval(jalankanSlideshow, 2000);

        // 2. NAVIGASI ANTAR TAHAP
        function pindahKeForm() {
            clearInterval(intervalSlideshow);
            document.getElementById('tahap-welcome').classList.add('hidden');
            document.getElementById('tahap-form').classList.remove('hidden');
        }

        let namaPemain = "";
        let emailPemain = "";

        function pindahKeKuis() {
            namaPemain = document.getElementById('nama-input').value.trim();
            emailPemain = document.getElementById('email-input').value.trim();

            if (namaPemain === "" || emailPemain === "") {
                alert("Harap isi Nama dan Email kamu terlebih dahulu ya!");
                return;
            }

            document.getElementById('tahap-form').classList.add('hidden');
            document.getElementById('tahap-kuis').classList.remove('hidden');
            tampilkanSoal();
        }

        // 3. BANK DATA 12 PERTANYAAN
        const dataKuis = [
            {
                q: "1. Temanmu hampir membuat keputusan berisiko besar. Kamu…",
                o: [
                    { t: "A. Mengambil alih demi melindungi dia", k: "guardian" },
                    { t: "B. Mendorong dia mengambil langkah besar", k: "visionary" },
                    { t: "C. Menjelaskan realita apa adanya", k: "truthteller" },
                    { t: "D. Menenangkan dia agar tidak panik", k: "peacemaker" }
                ]
            },
            {
                q: "2. Dalam konflik kelompok, kamu…",
                o: [
                    { t: "A. Menjaga semua orang tetap aman", k: "guardian" },
                    { t: "B. Mencari solusi ideal jangka panjang", k: "visionary" },
                    { t: "C. Menyampaikan fakta siapa yang benar", k: "truthteller" },
                    { t: "D. Meredakan suasana agar damai", k: "peacemaker" }
                ]
            },
            {
                q: "3. Seseorang sedang gagal dan frustrasi. Kamu…",
                o: [
                    { t: "A. Melindungi dia dari tekanan tambahan", k: "guardian" },
                    { t: "B. Mendorong dia bangkit lebih kuat", k: "charmer" },
                    { t: "C. Memberi perspektif jujur tentang kesalahannya", k: "truthteller" },
                    { t: "D. Membuat dia merasa lebih tenang", k: "peacemaker" }
                ]
            },
            {
                q: "4. Kalau seseorang mengabaikan nasihatmu, kamu…",
                o: [
                    { t: "A. Tetap mengawasi demi keamanannya", k: "guardian" },
                    { t: "B. Membiarkan dia belajar dari realita sendiri", k: "freespirit" },
                    { t: "C. Mengingatkan dengan tegas dan jujur", k: "truthteller" },
                    { t: "D. Mengurangi konflik dan tidak memaksa", k: "peacemaker" }
                ]
            },
            {
                q: "5. Saat kerja kelompok, kamu biasanya…",
                o: [
                    { t: "A. Mengatur agar semuanya aman dan stabil", k: "guardian" },
                    { t: "B. Rela memberikan fasilitas/bantuan agar semua sukses", k: "benefactor" },
                    { t: "C. Memberi arah besar yang jelas", k: "visionary" },
                    { t: "D. Menjaga suasana tetap harmonis", k: "peacemaker" }
                ]
            },
            {
                q: "6. Temanmu terlalu bergantung padamu. Kamu…",
                o: [
                    { t: "A. Mengontrol agar dia tidak jatuh", k: "guardian" },
                    { t: "B. Membantu memberikan koneksi/bantuan materi", k: "benefactor" },
                    { t: "C. Menghadapkan dia pada realita", k: "truthteller" },
                    { t: "D. Menenangkan agar dia tidak cemas berlebihan", k: "peacemaker" }
                ]
            },
            {
                q: "7. Saat melihat ketidakadilan, kamu…",
                o: [
                    { t: "A. Melindungi pihak yang lemah", k: "guardian" },
                    { t: "B. Menggunakan karisma untuk mengubah suasana", k: "charmer" },
                    { t: "C. Mengatakan fakta tanpa bias", k: "truthteller" },
                    { t: "D. Menjaga situasi tetap damai dulu", k: "peacemaker" }
                ]
            },
            {
                q: "8. Ketika rencana berubah mendadak, kamu…",
                o: [
                    { t: "A. Langsung mengamankan situasi", k: "guardian" },
                    { t: "B. Melihat peluang dan ide baru yang seru", k: "visionary" },
                    { t: "C. Menganalisis realita yang terjadi", k: "truthteller" },
                    { t: "D. Mengajak santai dan keluar dari zona kaku", k: "freespirit" }
                ]
            },
            {
                q: "9. Temanmu sedang sedih berat. Kamu…",
                o: [
                    { t: "A. Menjaganya sampai stabil", k: "guardian" },
                    { t: "B. Mengajak dia melakukan hal spontan yang seru", k: "freespirit" },
                    { t: "C. Memberi kebenaran yang perlu dia dengar", k: "truthteller" },
                    { t: "D. Menenangkan emosinya", k: "peacemaker" }
                ]
            },
            {
                q: "10. Dalam keputusan penting, kamu…",
                o: [
                    { t: "A. Memilih yang paling aman bagi kelompok", k: "guardian" },
                    { t: "B. Memilih yang paling visioner dan berstandar tinggi", k: "visionary" },
                    { t: "C. Memilih berdasarkan fakta paling realistis", k: "truthteller" },
                    { t: "D. Memilih yang paling damai dan minim konflik", k: "peacemaker" }
                ]
            },
            {
                q: "11. Jika seseorang tidak mendengarkanmu, kamu…",
                o: [
                    { t: "A. Tetap mengawasi agar dia tidak terluka", k: "guardian" },
                    { t: "B. Menggunakan pesona karismatik agar dia luluh", k: "charmer" },
                    { t: "C. Mengatakan kebenaran lebih tegas tanpa drama", k: "truthteller" },
                    { t: "D. Menghilang sementara/tidak mau ambil pusing", k: "freespirit" }
                ]
            },
            {
                q: "12. Gaya hidup yang kamu pilih lebih ke…",
                o: [
                    { t: "A. Melindungi dan mengayomi orang lain", k: "guardian" },
                    { t: "B. Suka berderma dan berinvestasi demi kesuksesan orang", k: "benefactor" },
                    { t: "C. Jujur, objektif, dan realistis", k: "truthteller" },
                    { t: "D. Hidup damai penuh keharmonisan tanpa konflik", k: "peacemaker" }
                ]
            }
        ];

        let indeksSoalSkrg = 0;
        let skorKepribadian = {
            guardian: 0, peacemaker: 0, visionary: 0, 
            truthteller: 0, charmer: 0, benefactor: 0, freespirit: 0
        };

        function tampilkanSoal() {
            if (indeksSoalSkrg >= dataKuis.length) {
                hitungDanTampilkanHasil();
                return;
            }

            document.getElementById('kuis-progress').innerText = `Soal ${indeksSoalSkrg + 1} dari ${dataKuis.length}`;
            let soalSkrg = dataKuis[indeksSoalSkrg];
            document.getElementById('kuis-soal').innerText = soalSkrg.q;

            let kontainerPilihan = document.getElementById('kuis-pilihan');
            kontainerPilihan.innerHTML = "";

            soalSkrg.o.forEach(opsi => {
                let tombol = document.createElement('button');
                tombol.className = "option-btn";
                tombol.innerText = opsi.t;
                tombol.onclick = () => pilihJawaban(opsi.k);
                kontainerPilihan.appendChild(tombol);
            });
        }

        function pilihJawaban(karakter) {
            skorKepribadian[karakter] = (skorKepribadian[karakter] || 0) + 1;
            indeksSoalSkrg++;
            tampilkanSoal();
        }

        // 4. LOGIKA HASIL AKHIR & PENGIRIMAN DATA KE PYTHON BACK-END
        function hitungDanTampilkanHasil() {
            document.getElementById('tahap-kuis').classList.add('hidden');
            document.getElementById('tahap-hasil').classList.remove('hidden');

            let karakterPemenang = "guardian"; 
            let skorTertinggi = -1;

            for (let kunci in skorKepribadian) {
                if (skorKepribadian[kunci] > skorTertinggi) {
                    skorTertinggi = skorKepribadian[kunci];
                    karakterPemenang = kunci;
                }
            }

            // Database Pemetaan Gambar .png yang Akurat Menggunakan Struktur static Flask
            const databaseKarakter = {
                "guardian": { nama: "THE GUARDIAN", tokoh: "(Julius Caesar)", img: "/static/21154.png", link: "https://scratch.mit.edu/projects/LINK_GUARDIAN_KAMU" },
                "peacemaker": { nama: "THE PEACEMAKER", tokoh: "(Barack Obama)", img: "/static/21153.png", link: "https://scratch.mit.edu/projects/LINK_PEACEMAKER_KAMU" },
                "visionary": { nama: "THE VISIONARY", tokoh: "(Alexander Agung)", img: "/static/21152.png", link: "https://scratch.mit.edu/projects/LINK_VISIONARY_KAMU" },
                "truthteller": { nama: "THE TRUTH TELLER", tokoh: "(Socrates)", img: "/static/21150.png", link: "https://scratch.mit.edu/projects/LINK_TRUTHTELLER_KAMU" },
                "charmer": { nama: "THE CHARMER", tokoh: "(Ratu Cleopatra)", img: "/static/21149.png", link: "https://scratch.mit.edu/projects/LINK_CHARMER_KAMU" },
                "benefactor": { nama: "THE BENEFACTOR", tokoh: "(Mr Beast)", img: "/static/21148.png", link: "https://scratch.mit.edu/projects/LINK_BENEFACTOR_KAMU" },
                "freespirit": { nama: "THE FREE SPIRIT", tokoh: "(Nikola Tesla)", img: "/static/21151.png", link: "https://scratch.mit.edu/projects/LINK_FREESPIRIT_KAMU" }
            };

            let hasilFinal = databaseKarakter[karakterPemenang] || databaseKarakter["guardian"];

            document.getElementById('hasil-karakter').innerText = hasilFinal.nama;
            document.getElementById('hasil-tokoh').innerText = hasilFinal.tokoh;
            document.getElementById('hasil-gambar').src = hasilFinal.img;
            
            document.getElementById('hasil-teks-ajakan').innerText = `Halo ${namaPemain}! Karakter tokomu adalah ${hasilFinal.nama} ${hasilFinal.tokoh}. Ingin tahu bagaimana petualangan serunya? Yuk buka link Scratch khusus karaktermu di bawah ini!`;
            
            document.getElementById('hasil-link-scratch').href = hasilFinal.link;

            // === PENAMBAHAN WAJIB TUGAS PYTHON ===
            // Mengirimkan hasil kuis ke server Python (app.py) agar dicatat ke file txt
            fetch('/simpan-peserta', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nama: namaPemain,
                    email: emailPemain,
                    karakter: hasilFinal.nama + " " + hasilFinal.tokoh
                })
            })
            .then(response => response.json())
            .then(data => console.log("Respon Server Python:", data.message))
            .catch(err => console.error("Gagal mengirim data ke Python Back-End:", err));
        }

        // 5. ENGINE NAVBAR MOBILE
        const mobileMenu = document.getElementById('mobile-menu');
        const navList = document.getElementById('nav-list');

        mobileMenu.addEventListener('click', () => {
            navList.classList.toggle('active');
            mobileMenu.classList.toggle('is-active');
        });
    </script>
</body>
</html>
