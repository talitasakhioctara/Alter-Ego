<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alter Ego - Product Quiz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@700&family=Metamorphous&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <style>
        /* Menyembunyikan tahap kuis yang belum aktif agar tidak bocor ke bawah */
        .hidden {
            display: none !important;
        }

        .quiz-box {
            background-color: #ffffff;
            border: none;
            border-radius: 15px;
            padding: 35px;
            max-width: 600px;
            margin: 40px auto;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Slide Animasi Karakter Pembuka */
        .slide-frame {
            width: 220px;
            height: 330px;
            margin: 0 auto 15px auto;
            overflow: hidden;
            border: none;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-img {
            max-width: 100%;
            max-height: 100%;
            display: none;
            object-fit: contain;
        }

        .slide-img.active {
            display: block;
        }

        .welcome-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 28px;
            color: #5c4033;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* Form Registrasi */
        .form-container {
            padding: 10px;
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            color: #5c4033;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #5c4033;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fcf9f2;
        }

        /* Tombol Aksi */
        .btn-action {
            display: inline-block;
            width: 100%;
            background: linear-gradient(135deg, #ff9900, #e65c00);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            margin-top: 15px;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-action:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(230, 92, 0, 0.3);
        }

        /* Tampilan Soal Kuis */
        .progress-bar {
            font-size: 14px;
            color: #7a5a40;
            font-weight: bold;
            text-align: right;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #5c4033;
            margin-bottom: 25px;
            text-align: left;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #fcf9f2;
            border: 2px solid #5c4033;
            color: #5c4033;
            padding: 14px 20px;
            font-size: 15px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Poppins', sans-serif;
        }
